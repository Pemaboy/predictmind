<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PredictMind AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#08111f;color:#f5f7fb}.wrap{max-width:980px;margin:auto;padding:20px}.hero{padding:26px 0}.brand{font-size:28px;font-weight:800}.tag{color:#9fb0c8}.card{background:#111d31;border:1px solid #23334d;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.btn{background:#5c78ff;color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.input{width:100%;padding:12px;border-radius:10px;border:1px solid #344660;background:#0a1525;color:#fff;margin:6px 0 10px}.muted{color:#9fb0c8}.bar{height:9px;background:#26364f;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7890ff}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1b2b47;margin:3px;font-size:12px}.hidden{display:none}.price{font-size:26px;font-weight:800}.small{font-size:13px}</style></head><body><div class="wrap"><div class="hero"><div class="brand">🧠 PredictMind AI</div><div class="tag">Data-driven football analysis and AI predictions</div></div><div id="status" class="card">Checking system…</div><div class="grid"><div class="card"><h2>Account</h2><input id="email" class="input" placeholder="Email"><input id="password" type="password" class="input" placeholder="Password"><button class="btn" onclick="register()">Create account</button> <button class="btn" onclick="login()">Login</button><p id="authmsg" class="muted small"></p></div><div class="card"><h2>Premium</h2><div class="price">₦2,500/month</div><p class="muted">Full prediction analysis, premium selections and history.</p><button class="btn" onclick="alert('Paystack connection is the next production step. Your account is ready for it.')">Subscribe</button></div></div><div class="card"><h2>Fixtures</h2><p class="muted">Live provider data appears here after the backend is synced.</p><div id="fixtures">Loading fixtures…</div></div></div><script>
const API='http://localhost:8000';let tokenValue=localStorage.getItem('pm_token');
async function j(url,opt={}){opt.headers={...(opt.headers||{}),...(tokenValue?{'Authorization':'Bearer '+tokenValue}:{})};let r=await fetch(API+url,opt);let d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function boot(){try{let h=await j('/health');document.getElementById('status').innerHTML=`Backend <b>online</b> · Live football provider <b>${h.live_provider_configured?'configured':'needs API key'}</b>`;let f=await j('/api/fixtures');document.getElementById('fixtures').innerHTML=f.length?f.map(x=>`<div class="card"><b>${x.home_name} vs ${x.away_name}</b><div class="muted small">${x.league_name||'League'} · ${new Date(x.kickoff).toLocaleString()} · ${x.status}</div><br><button class="btn" onclick="predict(${x.id})">AI Analyze</button></div>`).join(''):'No fixtures yet. Sync from API-Football on the backend.'}catch(e){document.getElementById('status').textContent=e.message}}
async function register(){try{let d=await j('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});tokenValue=d.token;localStorage.setItem('pm_token',tokenValue);authmsg.textContent='Account created.'}catch(e){authmsg.textContent=e.message}}
async function login(){try{let d=await j('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});tokenValue=d.token;localStorage.setItem('pm_token',tokenValue);authmsg.textContent='Logged in.'}catch(e){authmsg.textContent=e.message}}
async function predict(id){try{let d=await j('/api/predict/'+id,{method:'POST'});let p=d.prediction;alert(`AI Prediction\n\nHome: ${(p.home*100).toFixed(1)}%\nDraw: ${(p.draw*100).toFixed(1)}%\nAway: ${(p.away*100).toFixed(1)}%\nOver 2.5: ${(p.over25*100).toFixed(1)}%\nBTTS: ${(p.btts*100).toFixed(1)}%\nExpected score: ${p.score}`)}catch(e){alert(e.message)}}boot();
</script></body></html>
